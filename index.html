<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #111;
    font-family: Arial, sans-serif;
}

.whatsapp-chat {
    width: 320px;
    height: 450px;
    background: #e5ddd5;
    border-radius: 15px;
    overflow: hidden;
    margin: 30px auto;
    box-shadow: 0 0 20px #25D366;
}

.header {
    background: #075e54;
    color: white;
    padding: 15px;
    font-weight: bold;
}

.messages {
    padding: 15px;
    height: 290px;
}

.message {
    background: white;
    padding: 10px;
    border-radius: 10px;
    width: fit-content;
}

.input-area {
    display: flex;
    padding: 10px;
    background: white;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

button {
    background: #25D366;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 50%;
    margin-left: 5px;
}
</style>
</head>

<body>

<div class="whatsapp-chat">

    <div class="header">
        WhatsApp Chat
    </div>

    <div class="messages">
        <div class="message">
            Hallo! Wie kann ich dir helfen?
        </div>
    </div>

    <div class="input-area">
        <input id="msg" placeholder="Nachricht schreiben...">

        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<script>
function sendMessage() {
    let message = document.getElementById("msg").value;

    if (message.trim() === "") return;

    let phone = "491234567890";

    let url = "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}
</script>

</body>
</html>
